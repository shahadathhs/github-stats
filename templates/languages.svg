<svg id="gh-dark-mode-only" width="460" height="200" xmlns="http://www.w3.org/2000/svg">
<style>
  svg {
    font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif;
  }
  #card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1px; rx: 8px; ry: 8px; }
  #gh-dark-mode-only:target #card { fill: #0d1117; stroke: #30363d; }
  .title { font-size: 14px; font-weight: 600; fill: #1f2328; }
  #gh-dark-mode-only:target .title { fill: #e6edf3; }
  .center-num { font-size: 20px; font-weight: 700; fill: #1f2328; }
  .center-lbl { font-size: 9px; fill: #57606a; }
  #gh-dark-mode-only:target .center-num { fill: #e6edf3; }
  #gh-dark-mode-only:target .center-lbl { fill: #8b949e; }
  .lang-name { font-size: 11px; fill: #1f2328; }
  .lang-pct { font-size: 11px; fill: #57606a; }
  #gh-dark-mode-only:target .lang-name { fill: #e6edf3; }
  #gh-dark-mode-only:target .lang-pct { fill: #8b949e; }
</style>
<rect id="card" x="0" y="0" width="100%" height="100%"/>
<text x="16" y="26" class="title">Languages</text>
{{ segments }}
<text x="86" y="101" text-anchor="middle" class="center-num">{{ lang_count }}</text>
<text x="86" y="117" text-anchor="middle" class="center-lbl">languages</text>
{{ legend }}
</svg>
