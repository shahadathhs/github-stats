<svg id="gh-dark-mode-only" width="{{ card_width }}" height="{{ card_height }}" xmlns="http://www.w3.org/2000/svg">
<style>
  svg {
    font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif;
  }
  #card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1px; rx: 8px; ry: 8px; }
  #gh-dark-mode-only:target #card { fill: #0d1117; stroke: #30363d; }
  .title { font-size: 14px; font-weight: 600; fill: #1f2328; }
  #gh-dark-mode-only:target .title { fill: #e6edf3; }
  .month, .day { font-size: 9px; fill: #57606a; }
  #gh-dark-mode-only:target .month, #gh-dark-mode-only:target .day { fill: #8b949e; }
  .day { text-anchor: start; }
  .lvl0 { fill: #ebedf0; }
  .lvl1 { fill: #9be9a8; }
  .lvl2 { fill: #40c463; }
  .lvl3 { fill: #30a14e; }
  .lvl4 { fill: #216e39; }
  #gh-dark-mode-only:target .lvl0 { fill: #161b22; }
  #gh-dark-mode-only:target .lvl1 { fill: #0e4429; }
  #gh-dark-mode-only:target .lvl2 { fill: #006d32; }
  #gh-dark-mode-only:target .lvl3 { fill: #26a641; }
  #gh-dark-mode-only:target .lvl4 { fill: #39d353; }
  .stat-num { font-size: 15px; font-weight: 700; fill: #1f2328; }
  .stat-lbl { font-size: 9px; fill: #57606a; }
  #gh-dark-mode-only:target .stat-num { fill: #e6edf3; }
  #gh-dark-mode-only:target .stat-lbl { fill: #8b949e; }
  .divider { stroke: #d0d7de; stroke-width: 1px; }
  #gh-dark-mode-only:target .divider { stroke: #21262d; }
</style>
<rect id="card" x="0" y="0" width="100%" height="100%"/>
<text x="14" y="18" class="title">{{ name }} · last year</text>
{{ month_labels }}
{{ day_labels }}
{{ heatmap_cells }}
<line class="divider" x1="14" y1="124" x2="{{ divider_x2 }}" y2="124"/>
{{ stats_row }}
</svg>
